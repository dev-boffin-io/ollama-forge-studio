name: build-binaries

# check (syntax + tests): every push to main/master, every pull request, v* tags, and manually.
# build (3 OS binaries, ~100 MB each): only for v* tags and manual runs - not on every commit.
# release: only for v* tags, and it is the only job that gets write access.
# Actions are pinned to commit SHAs (the comment names the tag they were resolved from).
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm run check
      - run: npm run lint
      - run: npm test

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  asset: ollama-forge-studio-linux-x64 }
          - { os: macos-latest,   asset: ollama-forge-studio-macos-arm64 }
          - { os: windows-latest, asset: ollama-forge-studio-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm run build
      - name: Rename binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/ollama-forge-studio.exe "dist/${{ matrix.asset }}"; else mv dist/ollama-forge-studio "dist/${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "${{ matrix.asset }}"
          path: "dist/${{ matrix.asset }}"
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the only place that needs it: attaching binaries to the GitHub release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with: { files: "dist/*" }
